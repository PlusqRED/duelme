services:
  mongodb:
    image: mongo:8.2.5
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}
    command: ["mongod", "--auth"]
    ports:
      - "10.8.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      # `$$` keeps the credentials out of `docker inspect .Config.Healthcheck.Test`.
      # Compose leaves `$$VAR` as `$VAR` at apply time; the container's sh
      # expands it at runtime against MONGO_INITDB_ROOT_USERNAME/_PASSWORD,
      # which the mongo entrypoint already exports from `environment:` above.
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.runCommand({ping:1}).ok'"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s
    networks:
      - backend

  backend:
    image: ghcr.io/plusqred/duelme-backend:dev
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/duelme?authSource=admin
      PRIVY_APP_ID: ${PRIVY_APP_ID:?PRIVY_APP_ID must be set in .env}
      APP_BASE_URL: ${APP_BASE_URL:-https://dev.duelme.pro}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_RETURN_URL: ${STEAM_RETURN_URL:-https://dev.duelme.pro/api/v1/profiles/me/social/steam/callback}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
      TELEGRAM_RETURN_URL: ${TELEGRAM_RETURN_URL:-https://dev.duelme.pro/api/v1/profiles/me/social/telegram/callback}
      TELEGRAM_ISSUER: ${TELEGRAM_ISSUER:-https://oauth.telegram.org}
      # Dev-only MockUSDT + ETH faucet. Chain/RPC/addresses/amounts use the
      # defaults baked into application.yml; only the enable flag and signer
      # key travel through .env.
      FAUCET_ENABLED: ${FAUCET_ENABLED:-false}
      FAUCET_PRIVATE_KEY: ${FAUCET_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Dev backend runs in JVM mode (not native) — Spring Boot 4 needs more
    # heap headroom than the native image. Prod stays at 256m.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 5s
    networks:
      - backend
      - frontend

  frontend:
    image: ghcr.io/plusqred/duelme-frontend:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 5s
    networks:
      - frontend

volumes:
  mongodb_data:

networks:
  backend:
  frontend:
