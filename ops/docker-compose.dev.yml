services:
  mongodb:
    image: mongo:8.2.5
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}
    command: ["mongod", "--auth"]
    ports:
      - "10.8.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_ROOT_USERNAME}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.runCommand({ping:1}).ok", "--quiet"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s
    networks:
      - backend

  backend:
    image: ghcr.io/plusqred/duelme-backend:dev
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/duelme?authSource=admin
      PRIVY_APP_ID: ${PRIVY_APP_ID:?PRIVY_APP_ID must be set in .env}
      # Dev-only MockUSDT + ETH faucet. Chain/RPC/addresses/amounts use the
      # defaults baked into application.yml; only the enable flag and signer
      # key travel through .env.
      FAUCET_ENABLED: ${FAUCET_ENABLED:-false}
      FAUCET_PRIVATE_KEY: ${FAUCET_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 5s
    networks:
      - backend
      - frontend

  frontend:
    image: ghcr.io/plusqred/duelme-frontend:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 5s
    networks:
      - frontend

volumes:
  mongodb_data:

networks:
  backend:
  frontend:
