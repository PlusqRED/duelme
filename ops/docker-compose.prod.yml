services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1}).ok", "--quiet"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  backend:
    image: ghcr.io/plusqred/duelme-backend:dev
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/duelme
      PRIVY_APP_ID: ${PRIVY_APP_ID:?PRIVY_APP_ID must be set in .env}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m

  frontend:
    image: ghcr.io/plusqred/duelme-frontend:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m

volumes:
  mongodb_data:
