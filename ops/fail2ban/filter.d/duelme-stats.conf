# stats.duelme.pro (ops/caddy/stats.duelme.pro.Caddyfile): a request that sent credentials and
# still got a 401, i.e. a wrong password. The browser's first request sends none and also gets a
# 401, so only lines whose request headers hold Authorization (Caddy logs it as REDACTED) count.
# Once the password passes, the browser sends it with every request, and Rybbit answers 401 itself
# when its own session has run out; Caddy then logs the login as user_id, so only an empty one
# counts. Header values are JSON-escaped, so none can forge the unescaped fields that follow them,
# and the IP is the client_ip Caddy writes first, before any header a client controls.
[Definition]
failregex = ^\{"level":"\w+",.*?"logger":"[^"]+","msg":"handled request","request":\{"remote_ip":"[^"]+","remote_port":"\d+","client_ip":"<HOST>",.*"headers":\{.*"Authorization":\["REDACTED"\].*\},"bytes_read":\d+,"user_id":"","duration":[\d.eE+-]+,"size":\d+,"status":401,
ignoreregex =
datepattern = "ts"\s*:\s*{EPOCH}
