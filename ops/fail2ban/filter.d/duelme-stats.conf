# stats.duelme.pro (ops/caddy/stats.duelme.pro.Caddyfile): a request that sent credentials and
# still got a 401, i.e. a wrong password. The browser's first request sends none and also gets a
# 401, so only lines whose request headers hold Authorization (Caddy logs it as REDACTED) count;
# `status` follows `request` in Caddy's JSON, which keeps response headers out of the match, and
# the IP is the client_ip Caddy writes first, before any header a client controls.
[Definition]
failregex = ^\{"level":"\w+",.*?"logger":"[^"]+","msg":"handled request","request":\{"remote_ip":"[^"]+","remote_port":"\d+","client_ip":"<HOST>",.*"headers":\{.*"Authorization":\["REDACTED"\].*\},"bytes_read":.*"status":401,
ignoreregex =
datepattern = "ts"\s*:\s*{EPOCH}
