# Five wrong dashboard passwords within an hour ban the IP for a day. The ban covers 80 and 443,
# so a banned IP loses duelme.pro and dev.duelme.pro for that day too. bantime.increment in
# jail.local doubles each repeat ban, and recidive takes over after five.
[duelme-stats]
enabled = true
port = http,https
filter = duelme-stats
logpath = /var/log/caddy/stats.log
backend = auto
maxretry = 5
findtime = 1h
bantime = 1d
