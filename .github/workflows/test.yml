name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Forge Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install

      - name: Build
        run: forge build

      - name: Run tests
        run: forge test -v

      - name: Run coverage
        run: |
          forge coverage --report summary 2>&1 | tee coverage-output.txt

      - name: Parse coverage
        id: coverage
        working-directory: contracts
        run: |
          # Extract per-contract line coverage for all src/*.sol files
          # and compute total from src/ files only
          COVERED=0
          TOTAL=0
          while IFS= read -r line; do
            nums=$(echo "$line" | grep -oP '\d+/\d+' | head -1)
            c=$(echo "$nums" | cut -d'/' -f1)
            t=$(echo "$nums" | cut -d'/' -f2)
            COVERED=$((COVERED + c))
            TOTAL=$((TOTAL + t))
          done < <(grep '| src/' coverage-output.txt)

          if [ "$TOTAL" -gt 0 ]; then
            PCT=$(echo "scale=2; $COVERED * 100 / $TOTAL" | bc)
          else
            PCT="0"
          fi

          echo "total_coverage=$PCT" >> "$GITHUB_OUTPUT"

          # Determine color
          if (( $(echo "$PCT >= 90" | bc -l) )); then
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$PCT >= 75" | bc -l) )); then
            echo "color=green" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$PCT >= 60" | bc -l) )); then
            echo "color=yellow" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Coverage summary
        run: |
          echo "### Test Coverage (src/*.sol)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Coverage |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          grep '| src/' coverage-output.txt | while IFS= read -r line; do
            FILE=$(echo "$line" | awk -F'|' '{print $2}' | xargs)
            PCT=$(echo "$line" | grep -oP '\d+\.\d+%' | head -1)
            echo "| $FILE | $PCT |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "| **Total** | **${{ steps.coverage.outputs.total_coverage }}%** |" >> "$GITHUB_STEP_SUMMARY"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.COVERAGE_GIST_ID }}
          filename: duelme-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.total_coverage }}%
          color: ${{ steps.coverage.outputs.color }}
          namedLogo: solidity

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

  frontend:
    name: Frontend Checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: ci-placeholder-privy-app-id
        run: npm run build

  deploy-backend-dev:
    name: Deploy backend dev.duelme.pro
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [contracts, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: dev
      url: https://dev.duelme.pro
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fat JAR
        run: ./gradlew bootJar

      - name: Prepare artifact
        id: package
        run: |
          RELEASE_ID="${GITHUB_SHA::12}"
          JAR_PATH="build/libs/duelme-backend-0.0.1-SNAPSHOT.jar"
          ARTIFACT_PATH="$RUNNER_TEMP/duelme-backend-dev-${RELEASE_ID}.jar"

          cp "$JAR_PATH" "$ARTIFACT_PATH"

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(basename "$ARTIFACT_PATH")" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$(sha256sum "$ARTIFACT_PATH" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure known hosts
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release payload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/apps/duelme-backend-dev/incoming'
          scp \
            "${{ steps.package.outputs.artifact_path }}" \
            "$GITHUB_WORKSPACE/ops/deploy/deploy-backend-release.sh" \
            "$GITHUB_WORKSPACE/ops/systemd/user/duelme-backend-dev.service" \
            "$DEPLOY_USER@$DEPLOY_HOST:~/apps/duelme-backend-dev/incoming/"

      - name: Deploy release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          ARTIFACT_SHA256: ${{ steps.package.outputs.artifact_sha256 }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash ~/apps/duelme-backend-dev/incoming/deploy-backend-release.sh \
            ~/apps/duelme-backend-dev/incoming/$ARTIFACT_NAME \
            $RELEASE_ID \
            $ARTIFACT_SHA256 \
            ~/apps/duelme-backend-dev/incoming/duelme-backend-dev.service"

      - name: Verify health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health'

  deploy-dev:
    name: Deploy dev.duelme.pro
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: dev
      url: https://dev.duelme.pro
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build standalone app
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
        run: npm run build

      - name: Package standalone release
        id: package
        run: |
          RELEASE_ID="${GITHUB_SHA::12}"
          RELEASE_DIR="$RUNNER_TEMP/duelme-dev-release"
          ARTIFACT_PATH="$RUNNER_TEMP/duelme-dev-${RELEASE_ID}.tar.gz"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR/.next"

          cp -R .next/standalone/. "$RELEASE_DIR/"
          cp -R .next/static "$RELEASE_DIR/.next/static"
          cp -R public "$RELEASE_DIR/public"

          tar -C "$RELEASE_DIR" -czf "$ARTIFACT_PATH" .

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(basename "$ARTIFACT_PATH")" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$(sha256sum "$ARTIFACT_PATH" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure known hosts
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release payload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/apps/duelme-dev/incoming'
          scp \
            "${{ steps.package.outputs.artifact_path }}" \
            "$GITHUB_WORKSPACE/ops/deploy/deploy-release.sh" \
            "$GITHUB_WORKSPACE/ops/systemd/user/duelme-dev.service" \
            "$DEPLOY_USER@$DEPLOY_HOST:~/apps/duelme-dev/incoming/"

      - name: Deploy release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          ARTIFACT_SHA256: ${{ steps.package.outputs.artifact_sha256 }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash ~/apps/duelme-dev/incoming/deploy-release.sh \
            ~/apps/duelme-dev/incoming/$ARTIFACT_NAME \
            $RELEASE_ID \
            $ARTIFACT_SHA256 \
            ~/apps/duelme-dev/incoming/duelme-dev.service"

      - name: Verify local health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'curl --fail --silent --show-error http://127.0.0.1:3001/api/health'
