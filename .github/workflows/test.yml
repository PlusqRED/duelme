name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Forge Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install --quiet

      - name: Build
        run: forge build --silent

      - name: Run tests
        run: forge test -v

      - name: Run coverage
        run: |
          forge coverage --report summary 2>&1 | tee coverage-output.txt

      - name: Parse coverage
        id: coverage
        working-directory: contracts
        run: |
          COVERED=0
          TOTAL=0
          while IFS= read -r line; do
            nums=$(echo "$line" | grep -oP '\d+/\d+' | head -1)
            c=$(echo "$nums" | cut -d'/' -f1)
            t=$(echo "$nums" | cut -d'/' -f2)
            COVERED=$((COVERED + c))
            TOTAL=$((TOTAL + t))
          done < <(grep '| src/' coverage-output.txt)

          if [ "$TOTAL" -gt 0 ]; then
            PCT=$(echo "scale=2; $COVERED * 100 / $TOTAL" | bc)
          else
            PCT="0"
          fi

          echo "total_coverage=$PCT" >> "$GITHUB_OUTPUT"

          if (( $(echo "$PCT >= 90" | bc -l) )); then
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$PCT >= 75" | bc -l) )); then
            echo "color=green" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$PCT >= 60" | bc -l) )); then
            echo "color=yellow" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Coverage summary
        run: |
          echo "### Test Coverage (src/*.sol)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Coverage |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          grep '| src/' coverage-output.txt | while IFS= read -r line; do
            FILE=$(echo "$line" | awk -F'|' '{print $2}' | xargs)
            PCT=$(echo "$line" | grep -oP '\d+\.\d+%' | head -1)
            echo "| $FILE | $PCT |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "| **Total** | **${{ steps.coverage.outputs.total_coverage }}%** |" >> "$GITHUB_STEP_SUMMARY"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.COVERAGE_GIST_ID }}
          filename: duelme-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.total_coverage }}%
          color: ${{ steps.coverage.outputs.color }}
          namedLogo: solidity

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build -Pskip.aot=true --quiet --console=plain

  frontend:
    name: Frontend Checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --loglevel=warn

      - name: Lint
        run: npm run lint --silent

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: ci-placeholder-privy-app-id
        run: npm run build

  deploy-dev:
    name: Deploy dev.duelme.pro
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [contracts, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment:
      name: dev
      url: https://dev.duelme.pro

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/plusqred/duelme-backend:dev
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          no-cache-filters: build

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/plusqred/duelme-frontend:dev
          build-args: |
            NEXT_PUBLIC_PRIVY_APP_ID=${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure known hosts
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -q ops/docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:~/apps/duelme-dev/docker-compose.yml"
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" '
            cd ~/apps/duelme-dev
            docker compose pull -q
            docker compose up -d --remove-orphans --quiet-pull
          '

      - name: Verify health checks
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for i in $(seq 1 30); do
            if ssh -q "$DEPLOY_USER@$DEPLOY_HOST" 'curl -sf http://127.0.0.1:8080/api/v1/health && curl -sf http://127.0.0.1:3001/api/health' 2>/dev/null; then
              echo "Health checks passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health checks failed after 60s"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'cd ~/apps/duelme-dev && docker compose ps && docker compose logs --tail=20'
          exit 1
