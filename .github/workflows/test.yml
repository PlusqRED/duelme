name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Forge Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install

      - name: Build
        run: forge build

      - name: Run tests
        run: forge test -v

      - name: Run coverage
        run: |
          forge coverage --report summary 2>&1 | tee coverage-output.txt

      - name: Parse coverage
        id: coverage
        working-directory: contracts
        run: |
          # Extract per-contract line coverage for all src/*.sol files
          # and compute total from src/ files only
          COVERED=0
          TOTAL=0
          while IFS= read -r line; do
            nums=$(echo "$line" | grep -oP '\d+/\d+' | head -1)
            c=$(echo "$nums" | cut -d'/' -f1)
            t=$(echo "$nums" | cut -d'/' -f2)
            COVERED=$((COVERED + c))
            TOTAL=$((TOTAL + t))
          done < <(grep '| src/' coverage-output.txt)

          if [ "$TOTAL" -gt 0 ]; then
            PCT=$(echo "scale=2; $COVERED * 100 / $TOTAL" | bc)
          else
            PCT="0"
          fi

          echo "total_coverage=$PCT" >> "$GITHUB_OUTPUT"

          # Determine color
          if (( $(echo "$PCT >= 90" | bc -l) )); then
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$PCT >= 75" | bc -l) )); then
            echo "color=green" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$PCT >= 60" | bc -l) )); then
            echo "color=yellow" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Coverage summary
        run: |
          echo "### Test Coverage (src/*.sol)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          grep '| src/' coverage-output.txt | while IFS= read -r line; do
            FILE=$(echo "$line" | awk -F'|' '{print $2}' | xargs)
            PCT=$(echo "$line" | grep -oP '\d+\.\d+%' | head -1)
            echo "| $FILE | $PCT |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "| **Total** | **${{ steps.coverage.outputs.total_coverage }}%** |" >> "$GITHUB_STEP_SUMMARY"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.COVERAGE_GIST_ID }}
          filename: duelme-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.total_coverage }}%
          color: ${{ steps.coverage.outputs.color }}
          namedLogo: solidity
