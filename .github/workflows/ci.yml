name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Forge Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1

      - name: Install dependencies
        run: forge install --quiet

      - name: Build
        run: forge build --silent

      - name: Run tests
        run: forge test -v

      - name: Run coverage
        run: |
          forge coverage --report summary 2>&1 | tee coverage-output.txt

      - name: Parse coverage
        id: coverage
        working-directory: contracts
        run: |
          COVERED=0
          TOTAL=0
          while IFS= read -r line; do
            nums=$(echo "$line" | grep -oP '\d+/\d+' | head -1)
            c=$(echo "$nums" | cut -d'/' -f1)
            t=$(echo "$nums" | cut -d'/' -f2)
            COVERED=$((COVERED + c))
            TOTAL=$((TOTAL + t))
          done < <(grep '| src/' coverage-output.txt)

          if [ "$TOTAL" -gt 0 ]; then
            PCT=$(echo "scale=2; $COVERED * 100 / $TOTAL" | bc)
          else
            PCT="0"
          fi

          echo "total_coverage=$PCT" >> "$GITHUB_OUTPUT"

          if (( $(echo "$PCT >= 90" | bc -l) )); then
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$PCT >= 75" | bc -l) )); then
            echo "color=green" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$PCT >= 60" | bc -l) )); then
            echo "color=yellow" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Coverage summary
        run: |
          echo "### Test Coverage (src/*.sol)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Coverage |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          grep '| src/' coverage-output.txt | while IFS= read -r line; do
            FILE=$(echo "$line" | awk -F'|' '{print $2}' | xargs)
            PCT=$(echo "$line" | grep -oP '\d+\.\d+%' | head -1)
            echo "| $FILE | $PCT |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "| **Total** | **${{ steps.coverage.outputs.total_coverage }}%** |" >> "$GITHUB_STEP_SUMMARY"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.COVERAGE_GIST_ID }}
          filename: duelme-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.total_coverage }}%
          color: ${{ steps.coverage.outputs.color }}
          namedLogo: solidity

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Flapdoodle downloads ~200MB MongoDB binary on first run into ~/.embedmongo;
      # cache it across runs to save 30-60s.
      - name: Cache Flapdoodle MongoDB binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedmongo
          key: flapdoodle-${{ runner.os }}-v1

      # `build` runs tests + bootJar (Spring Boot plugin wires bootJar into assemble).
      - name: Build, test, package
        run: ./gradlew build -Pskip.aot=true --console=plain

      - name: Upload backend JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-jar
          path: backend/build/libs/*-SNAPSHOT.jar
          retention-days: 1
          if-no-files-found: error

  # Native image is the prod runtime. We always run nativeCompile on push to
  # dev / main and on PRs as a smoke test — see CLAUDE.md "Native Image
  # Compatibility (CRITICAL)". Failure here means prod will not deploy.
  # Only on push to main do we upload the binary as a build-prod artifact.
  #
  # DO NOT add an `if:` to this job. GitHub Actions treats a `skipped` needs:
  # entry as `success`, so adding `if:` would silently let prod deploys
  # bypass the native gate. The job runs on every triggered event by design.
  backend-native:
    name: Backend Native Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@cabbb10818fabc989d6dbd508e4846596d20dd2d # v1.6.0
        with:
          java-version: '25'
          distribution: graalvm-community

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Native compile
        run: ./gradlew nativeCompile --console=plain

      - name: Upload backend native binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-native
          path: backend/build/native/nativeCompile/duelme-backend
          retention-days: 1
          if-no-files-found: error

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm via Corepack (matches frontend/package.json packageManager)
        run: |
          # `corepack enable` on its own does NOT shim npm (npm ships with Node);
          # explicitly enabling npm replaces the bundled binary with a corepack shim
          # that honours the `packageManager` field in package.json.
          corepack enable npm
          corepack prepare npm@11.12.1 --activate
          npm --version

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --loglevel=warn

      - name: Lint
        run: npm run lint --silent

      - name: Typecheck
        run: npx tsc --noEmit

  # build-dev intentionally does NOT need backend-native — keeps dev iteration
  # fast even if a change happens to break native compile. Native breakage is
  # caught by the backend-native job (red X on the commit) and gates prod.
  build-dev:
    name: Build dev ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [contracts, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment: dev
    strategy:
      matrix:
        include:
          - service: backend
            context: backend
            image: ghcr.io/plusqred/duelme-backend
            tag: dev
            scope: backend-dev
            target: jvm
            chain_key: ''
          - service: frontend
            context: frontend
            image: ghcr.io/plusqred/duelme-frontend
            tag: dev
            scope: frontend-dev
            target: ''
            chain_key: arbitrumSepolia

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Download backend JAR
        if: matrix.service == 'backend'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-jar
          path: backend/build/libs/

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ matrix.tag }}
            ${{ matrix.image }}:${{ matrix.tag }}-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_PRIVY_APP_ID=${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
            NEXT_PUBLIC_DEFAULT_CHAIN_KEY=${{ matrix.chain_key }}
            NEXT_PUBLIC_ARBITRUM_RPC_URL=${{ secrets.NEXT_PUBLIC_ARBITRUM_RPC_URL }}
            NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC_URL=${{ secrets.NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC_URL }}
            NEXT_PUBLIC_PIMLICO_API_KEY=${{ secrets.NEXT_PUBLIC_PIMLICO_API_KEY }}
            NEXT_PUBLIC_PIMLICO_SPONSORSHIP_POLICY_ID_ARBITRUM=${{ secrets.NEXT_PUBLIC_PIMLICO_SPONSORSHIP_POLICY_ID_ARBITRUM }}
            NEXT_PUBLIC_PIMLICO_SPONSORSHIP_POLICY_ID_ARBITRUM_SEPOLIA=${{ secrets.NEXT_PUBLIC_PIMLICO_SPONSORSHIP_POLICY_ID_ARBITRUM_SEPOLIA }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  deploy-dev:
    name: Deploy dev.duelme.pro
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [build-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: dev

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Start SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure known hosts
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_RETURN_URL: ${{ secrets.STEAM_RETURN_URL }}
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          TELEGRAM_RETURN_URL: ${{ secrets.TELEGRAM_RETURN_URL }}
          TELEGRAM_ISSUER: ${{ secrets.TELEGRAM_ISSUER }}
          # Testnet faucet key for the dev-only ETH + MockUSDT dispenser.
          # Use a dedicated hot wallet, NEVER a key that holds mainnet funds.
          FAUCET_PRIVATE_KEY: ${{ secrets.FAUCET_PRIVATE_KEY }}
        run: |
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/apps/duelme-dev'
          scp -q ops/docker-compose.dev.yml "$DEPLOY_USER@$DEPLOY_HOST:~/apps/duelme-dev/docker-compose.yml"
          # Pipe secrets via stdin so they never appear in ps / audit / .bash_history.
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077 && cat > ~/apps/duelme-dev/.env' <<ENVEOF
          PRIVY_APP_ID=$PRIVY_APP_ID
          MONGO_ROOT_USERNAME=$MONGO_ROOT_USERNAME
          MONGO_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD
          APP_BASE_URL=$APP_BASE_URL
          STEAM_API_KEY=$STEAM_API_KEY
          STEAM_RETURN_URL=$STEAM_RETURN_URL
          TELEGRAM_CLIENT_ID=$TELEGRAM_CLIENT_ID
          TELEGRAM_CLIENT_SECRET=$TELEGRAM_CLIENT_SECRET
          TELEGRAM_RETURN_URL=$TELEGRAM_RETURN_URL
          TELEGRAM_ISSUER=$TELEGRAM_ISSUER
          FAUCET_ENABLED=true
          FAUCET_PRIVATE_KEY=$FAUCET_PRIVATE_KEY
          ENVEOF
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" '
            cd ~/apps/duelme-dev
            docker compose pull -q
            docker compose up -d --remove-orphans --quiet-pull
          '

      - name: Verify health checks
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for i in $(seq 1 30); do
            if ssh -q "$DEPLOY_USER@$DEPLOY_HOST" 'curl -sf http://127.0.0.1:8080/api/v1/health && curl -sf http://127.0.0.1:3001/api/health' 2>/dev/null; then
              echo "Health checks passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health checks failed after 60s"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'cd ~/apps/duelme-dev && docker compose ps && docker compose logs --tail=20'
          exit 1

      - name: Rollback on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "Stopping broken containers..."
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" '
            cd ~/apps/duelme-dev
            docker compose stop backend frontend
          '

  # `backend` stays in needs: as a JVM-mode test gate (Spring Boot integration
  # tests run against Flapdoodle, no native build). `backend-native` is the
  # prod artifact source — it produces the binary that this job ships.
  build-prod:
    name: Build prod ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contracts, backend, backend-native, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment: prod
    strategy:
      matrix:
        include:
          - service: backend
            context: backend
            image: ghcr.io/plusqred/duelme-backend
            tag: latest
            scope: backend-prod
            target: native
            chain_key: ''
          - service: frontend
            context: frontend
            image: ghcr.io/plusqred/duelme-frontend
            tag: latest
            scope: frontend-prod
            target: ''
            chain_key: arbitrum

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Download backend native binary
        if: matrix.service == 'backend'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-native
          path: backend/build/native/nativeCompile/

      - name: Restore native binary execute bit
        if: matrix.service == 'backend'
        run: chmod +x backend/build/native/nativeCompile/duelme-backend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ matrix.tag }}
            ${{ matrix.image }}:${{ matrix.tag }}-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_PRIVY_APP_ID=${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
            NEXT_PUBLIC_DEFAULT_CHAIN_KEY=${{ matrix.chain_key }}
            NEXT_PUBLIC_ARBITRUM_RPC_URL=${{ secrets.NEXT_PUBLIC_ARBITRUM_RPC_URL }}
            NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC_URL=${{ secrets.NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC_URL }}
            NEXT_PUBLIC_PIMLICO_API_KEY=${{ secrets.NEXT_PUBLIC_PIMLICO_API_KEY }}
            NEXT_PUBLIC_PIMLICO_SPONSORSHIP_POLICY_ID_ARBITRUM=${{ secrets.NEXT_PUBLIC_PIMLICO_SPONSORSHIP_POLICY_ID_ARBITRUM }}
            NEXT_PUBLIC_PIMLICO_SPONSORSHIP_POLICY_ID_ARBITRUM_SEPOLIA=${{ secrets.NEXT_PUBLIC_PIMLICO_SPONSORSHIP_POLICY_ID_ARBITRUM_SEPOLIA }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  deploy-prod:
    name: Deploy duelme.pro
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: prod

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Start SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure known hosts
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_RETURN_URL: ${{ secrets.STEAM_RETURN_URL }}
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          TELEGRAM_RETURN_URL: ${{ secrets.TELEGRAM_RETURN_URL }}
          TELEGRAM_ISSUER: ${{ secrets.TELEGRAM_ISSUER }}
        run: |
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/apps/duelme-prod'
          scp -q ops/docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:~/apps/duelme-prod/docker-compose.yml"
          # Pipe secrets via stdin so they never appear in ps / audit / .bash_history.
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" 'umask 077 && cat > ~/apps/duelme-prod/.env' <<ENVEOF
          PRIVY_APP_ID=$PRIVY_APP_ID
          MONGO_ROOT_USERNAME=$MONGO_ROOT_USERNAME
          MONGO_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD
          APP_BASE_URL=$APP_BASE_URL
          STEAM_API_KEY=$STEAM_API_KEY
          STEAM_RETURN_URL=$STEAM_RETURN_URL
          TELEGRAM_CLIENT_ID=$TELEGRAM_CLIENT_ID
          TELEGRAM_CLIENT_SECRET=$TELEGRAM_CLIENT_SECRET
          TELEGRAM_RETURN_URL=$TELEGRAM_RETURN_URL
          TELEGRAM_ISSUER=$TELEGRAM_ISSUER
          ENVEOF
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" '
            cd ~/apps/duelme-prod
            docker compose pull -q
            docker compose up -d --remove-orphans --quiet-pull
          '

      - name: Verify health checks
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for i in $(seq 1 30); do
            if ssh -q "$DEPLOY_USER@$DEPLOY_HOST" 'curl -sf http://127.0.0.1:8081/api/v1/health && curl -sf http://127.0.0.1:3002/api/health' 2>/dev/null; then
              echo "Health checks passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health checks failed after 60s"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'cd ~/apps/duelme-prod && docker compose ps && docker compose logs --tail=20'
          exit 1

      - name: Rollback on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "Stopping broken containers..."
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" '
            cd ~/apps/duelme-prod
            docker compose stop backend frontend
          '
