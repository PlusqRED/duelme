name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Forge Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1

      - name: Install dependencies
        run: forge install --quiet

      - name: Build
        run: forge build --silent

      - name: Run tests
        run: forge test -v

      - name: Run coverage
        run: |
          forge coverage --report summary 2>&1 | tee coverage-output.txt

      - name: Parse coverage
        id: coverage
        working-directory: contracts
        run: |
          COVERED=0
          TOTAL=0
          while IFS= read -r line; do
            nums=$(echo "$line" | grep -oP '\d+/\d+' | head -1)
            c=$(echo "$nums" | cut -d'/' -f1)
            t=$(echo "$nums" | cut -d'/' -f2)
            COVERED=$((COVERED + c))
            TOTAL=$((TOTAL + t))
          done < <(grep '| src/' coverage-output.txt)

          if [ "$TOTAL" -gt 0 ]; then
            PCT=$(echo "scale=2; $COVERED * 100 / $TOTAL" | bc)
          else
            PCT="0"
          fi

          echo "total_coverage=$PCT" >> "$GITHUB_OUTPUT"

          if (( $(echo "$PCT >= 90" | bc -l) )); then
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$PCT >= 75" | bc -l) )); then
            echo "color=green" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$PCT >= 60" | bc -l) )); then
            echo "color=yellow" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Coverage summary
        run: |
          echo "### Test Coverage (src/*.sol)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Coverage |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          grep '| src/' coverage-output.txt | while IFS= read -r line; do
            FILE=$(echo "$line" | awk -F'|' '{print $2}' | xargs)
            PCT=$(echo "$line" | grep -oP '\d+\.\d+%' | head -1)
            echo "| $FILE | $PCT |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "| **Total** | **${{ steps.coverage.outputs.total_coverage }}%** |" >> "$GITHUB_STEP_SUMMARY"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@0e50b8bad39e7e1afd3e4e9c2b7dd145fad07501 # v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.COVERAGE_GIST_ID }}
          filename: duelme-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.total_coverage }}%
          color: ${{ steps.coverage.outputs.color }}
          namedLogo: solidity

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Build and test
        run: ./gradlew build -Pskip.aot=true --quiet --console=plain

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --loglevel=warn

      - name: Lint
        run: npm run lint --silent

      - name: Typecheck
        run: npx tsc --noEmit

  build-dev:
    name: Build dev ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [contracts, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment: dev
    strategy:
      matrix:
        include:
          - service: backend
            context: backend
            image: ghcr.io/plusqred/duelme-backend
            tag: dev
            scope: backend-dev
          - service: frontend
            context: frontend
            image: ghcr.io/plusqred/duelme-frontend
            tag: dev
            scope: frontend-dev

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ matrix.tag }}
            ${{ matrix.image }}:${{ matrix.tag }}-${{ github.sha }}
          build-args: NEXT_PUBLIC_PRIVY_APP_ID=${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  deploy-dev:
    name: Deploy dev.duelme.pro
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [build-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: dev

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Start SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure known hosts
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
        run: |
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/apps/duelme-dev'
          scp -q ops/docker-compose.dev.yml "$DEPLOY_USER@$DEPLOY_HOST:~/apps/duelme-dev/docker-compose.yml"
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" "cat > ~/apps/duelme-dev/.env << 'ENVEOF'
          PRIVY_APP_ID=$PRIVY_APP_ID
          MONGO_ROOT_USERNAME=$MONGO_ROOT_USERNAME
          MONGO_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD
          ENVEOF
          chmod 600 ~/apps/duelme-dev/.env"
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" '
            cd ~/apps/duelme-dev
            docker compose pull -q
            docker compose up -d --remove-orphans --quiet-pull
          '

      - name: Verify health checks
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for i in $(seq 1 30); do
            if ssh -q "$DEPLOY_USER@$DEPLOY_HOST" 'curl -sf http://127.0.0.1:8080/api/v1/health && curl -sf http://127.0.0.1:3001/api/health' 2>/dev/null; then
              echo "Health checks passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health checks failed after 60s"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'cd ~/apps/duelme-dev && docker compose ps && docker compose logs --tail=20'
          exit 1

      - name: Rollback on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "Stopping broken containers..."
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" '
            cd ~/apps/duelme-dev
            docker compose stop backend frontend
          '

  build-prod:
    name: Build prod ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [contracts, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment: prod
    strategy:
      matrix:
        include:
          - service: backend
            context: backend
            image: ghcr.io/plusqred/duelme-backend
            tag: latest
            scope: backend-prod
          - service: frontend
            context: frontend
            image: ghcr.io/plusqred/duelme-frontend
            tag: latest
            scope: frontend-prod

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ matrix.tag }}
            ${{ matrix.image }}:${{ matrix.tag }}-${{ github.sha }}
          build-args: NEXT_PUBLIC_PRIVY_APP_ID=${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  deploy-prod:
    name: Deploy duelme.pro
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: prod

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Start SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure known hosts
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
        run: |
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/apps/duelme-prod'
          scp -q ops/docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:~/apps/duelme-prod/docker-compose.yml"
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" "cat > ~/apps/duelme-prod/.env << 'ENVEOF'
          PRIVY_APP_ID=$PRIVY_APP_ID
          MONGO_ROOT_USERNAME=$MONGO_ROOT_USERNAME
          MONGO_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD
          ENVEOF
          chmod 600 ~/apps/duelme-prod/.env"
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" '
            cd ~/apps/duelme-prod
            docker compose pull -q
            docker compose up -d --remove-orphans --quiet-pull
          '

      - name: Verify health checks
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for i in $(seq 1 30); do
            if ssh -q "$DEPLOY_USER@$DEPLOY_HOST" 'curl -sf http://127.0.0.1:8081/api/v1/health && curl -sf http://127.0.0.1:3002/api/health' 2>/dev/null; then
              echo "Health checks passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health checks failed after 60s"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'cd ~/apps/duelme-prod && docker compose ps && docker compose logs --tail=20'
          exit 1

      - name: Rollback on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "Stopping broken containers..."
          ssh -q "$DEPLOY_USER@$DEPLOY_HOST" '
            cd ~/apps/duelme-prod
            docker compose stop backend frontend
          '
