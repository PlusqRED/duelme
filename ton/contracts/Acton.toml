# Acton project manifest for the DuelMe TON contract.
#
# See https://ton-blockchain.github.io/acton/docs/acton-toml for the full schema.

[package]
name = "duelme-ton"
description = "DuelMe — P2P TON duel platform"
version = "0.1.0"
license = "MIT"

[toolchain]
acton = "1.0.0"

[contracts.DuelMe]
display-name = "DuelMe"
src = "contracts/duelme.tolk"
depends = []

[test]

[fmt]
width = 100
ignore = []

[scripts]
deploy-emulation = "acton script scripts/deploy.tolk"
deploy-testnet = "acton script scripts/deploy.tolk --net testnet"
deploy-mainnet = "acton script scripts/deploy.tolk --net mainnet"

[import-mappings]
acton = ".acton"
contracts = "contracts"
gen = "gen"
tests = "tests"
wrappers = "wrappers"
