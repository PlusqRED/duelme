[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.34"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

# The solvency suite in test/DuelMeInvariant.t.sol. Every handler action swallows its own
# revert, so anything that escapes to the runner is a real failure.
#
# 512 x 256 is 131,072 calls. It was 64 x 128 until the mainnet deploy, then 256 x 256 — the
# contract is immutable and holds other people's money, so the search budget is worth the CI
# minute. Keep the depth: the same number of calls in shorter sequences (512 x 128, 1024 x 64)
# confirmed, refunded and claimed far fewer duels.
#
# Every invariant is checked after every call and walks every duel, so a run costs depth squared.
# `workers = "auto"` derives from `--jobs`, which the other suites share, and left this suite on
# one thread: 256 x 256 took over a minute in CI. Four workers draw their sequences differently —
# at 256 runs they reached those deep states about a third less often than one worker did — so
# the run count is doubled with them; 512 runs on four workers reach them at least as often, in
# about half the time.
[invariant]
runs = 512
depth = 256
workers = 4
fail_on_revert = true

# `FOUNDRY_PROFILE=coverage forge coverage`, as CI runs it. Coverage only records which lines run;
# the search above has already run under `forge test`, and repeating it instrumented and
# unoptimised took CI four more minutes. At this budget the line and branch counts equal the full
# search's.
[profile.coverage.invariant]
runs = 128
depth = 128

# Resolves the verifier key from the environment, so `--verify` works off `.env` alone and a
# forgotten `--etherscan-api-key` cannot turn a deploy into an unverified contract. One Arbiscan
# key covers both chains; `chain` is spelled out because the V2 API routes on the id, not the name.
[etherscan]
arbitrum-sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
arbitrum = { key = "${ARBISCAN_API_KEY}", chain = 42161 }
