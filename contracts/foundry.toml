[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.34"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

# The solvency suite in test/DuelMeInvariant.t.sol. Every handler action swallows its own
# revert, so anything that escapes to the runner is a real failure.
#
# The contract is immutable and holds other people's money, so the search budget is worth the CI
# minute. Keep the depth: the same number of calls in shorter sequences (512 x 128, 1024 x 64)
# confirmed, refunded and claimed far fewer duels.
#
# The two solvency invariants walk every duel after every call, so a run costs depth squared, and
# `workers = "auto"` follows `--jobs`, which the other suites share, so it left this suite on one
# thread. Four workers — the vCPUs of GitHub's runner for public repos — reach deep states less
# often per run, hence 512 runs: with them the suite reaches those states at least as often as one
# worker did at 256. Locally that takes half the time; in CI, 80 s against 61-114 s before.
[invariant]
runs = 512
depth = 256
workers = 4
fail_on_revert = true

# For `forge coverage --profile coverage`, as CI runs it. Coverage only records which lines run;
# the full search has already run under `forge test`. At this budget the line and branch counts
# equal the full search's, and without the invariant suite they drop; the seed keeps the counts
# from depending on luck.
[profile.coverage.fuzz]
seed = "0x1"

[profile.coverage.invariant]
runs = 128
depth = 128

# Resolves the verifier key from the environment, so `--verify` works off `.env` alone and a
# forgotten `--etherscan-api-key` cannot turn a deploy into an unverified contract. One Arbiscan
# key covers both chains; `chain` is spelled out because the V2 API routes on the id, not the name.
[etherscan]
arbitrum-sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
arbitrum = { key = "${ARBISCAN_API_KEY}", chain = 42161 }
