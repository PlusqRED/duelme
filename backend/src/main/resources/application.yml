server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/duelme}

privy:
  app-id: ${PRIVY_APP_ID}

duelme:
  # The DuelMe deployment live on each chain. Hand-mirrored from
  # contracts/broadcast/*/run-latest.json, the same copy frontend constants.ts
  # keeps; deployedAddresses.test.ts pins both to the artifact, so a redeploy
  # that misses one fails the frontend suite. Quoted for the same reason as
  # mock-usdt-address below.
  contracts:
    duel-me:
      "421614": "0x296e1dB6ec3F3916c723F1D40D90CbAE56D7D792"
      "42161": "0x32b3c9aF55c7C784bdf9128a1f681A66A37Bd261"
  # The games the catalog holds before anyone has duelled in them, by category: every game with a
  # guide in frontend/src/content/gameGuides (gameGuides.test.ts fails on one missing or in another
  # category), and the names Russian players know some of them by, each a game of its own for
  # players to pick. Written at every boot, so moving a game here moves it in the catalog.
  catalog:
    games:
      FPS:
        - CS2
        - Call of Duty
        - Valorant
        - Fortnite
        - Standoff 2
        - PUBG Mobile
      MOBA:
        - Dota 2
        - League of Legends
        - "Mobile Legends: Bang Bang"
      SPORT:
        - EA SPORTS FC
        - Madden NFL
        - NBA 2K
        - Rocket League
        - eFootball
        - 8 Ball Pool
      STRATEGY:
        - StarCraft II
        - Age of Empires II
        - Heroes of Might and Magic III
        - Герои Меча и Магии III
        - Warcraft III
        - Clash Royale
      FIGHTING:
        - Street Fighter 6
        - Tekken 8
        - Mortal Kombat 1
        - Super Smash Bros. Ultimate
        - Guilty Gear Strive
        - Brawlhalla
      CARD:
        - Poker
        - Покер
        - Durak
        - Дурак
        - "Magic: The Gathering"
        - Hearthstone
      BOARD:
        - Chess
        - Шахматы
        - Backgammon
        - Нарды
        - Checkers
        - Шашки
      MMO:
        - World of Warcraft
        - Lineage 2
      OFFLINE:
        - Billiards
        - Бильярд
        - Darts
        - Дартс
        - Table Tennis
        - Настольный теннис
  # Dev-only MockUSDT + ETH faucet. Prod must keep `enabled=false` (the default).
  faucet:
    enabled: ${FAUCET_ENABLED:false}
    private-key: ${FAUCET_PRIVATE_KEY:}
    rpc-url: ${FAUCET_RPC_URL:https://sepolia-rollup.arbitrum.io/rpc}
    chain-id: ${FAUCET_CHAIN_ID:421614}
    # No ${…} placeholder on purpose: this must be the MockUSDT the live DuelMe was
    # deployed against, which is the same redeploy that edits frontend constants.ts.
    # deployedAddresses.test.ts pins it to the broadcast artifact.
    # Quoted: YAML reads a bare 0x… as a hex integer, and Spring would then bind the decimal
    # form, failing FaucetService's address check at startup and taking the whole backend
    # down with it — not just the faucet.
    mock-usdt-address: "0x4a313B0F6ddD36456BA2fFCFa4C36F494BA8F3b9"
    eth-amount-eth: ${FAUCET_ETH_AMOUNT_ETH:0.001}
    usdt-amount-raw: ${FAUCET_USDT_AMOUNT_RAW:100000000}
  social:
    app-base-url: ${APP_BASE_URL:http://localhost:3000}
    steam:
      api-key: ${STEAM_API_KEY:}
      return-url: ${STEAM_RETURN_URL:}
    telegram:
      client-id: ${TELEGRAM_CLIENT_ID:}
      client-secret: ${TELEGRAM_CLIENT_SECRET:}
      return-url: ${TELEGRAM_RETURN_URL:}
      issuer: ${TELEGRAM_ISSUER:https://oauth.telegram.org}
  # Reported by /api/v1/health. APP_RELEASE is baked into the image at build time, APP_ENV is
  # set by the compose file; blank reads as "unknown".
  build:
    environment: ${APP_ENV:}
    release: ${APP_RELEASE:}

springdoc:
  api-docs:
    path: /api/v1/docs
  swagger-ui:
    path: /api/v1/swagger-ui
